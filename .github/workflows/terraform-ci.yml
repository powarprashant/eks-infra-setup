name: "Terraform CI"

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/dev/**"
      - "modules/**"
      - ".github/workflows/terraform-*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_CLI_ARGS: "-no-color"
  STATE_BUCKET: "cloudcart-terraform-state"
  LOCK_TABLE: "terraform-lock"

jobs:
  validate:
    name: "Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate Dev
        run: |
          terraform -chdir=environments/dev init -backend=false
          terraform -chdir=environments/dev validate

  plan-dev:
    name: "Plan (dev)"
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Bootstrap Terraform Backend
        run: |
          BUCKET="${{ env.STATE_BUCKET }}"
          TABLE="${{ env.LOCK_TABLE }}"
          REGION="${{ secrets.AWS_REGION }}"

          echo "==> Checking S3 bucket: $BUCKET"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "  Creating bucket..."
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --create-bucket-configuration LocationConstraint="$REGION"
            echo "  Bucket created."
          else
            echo "  Bucket already exists."
          fi

          echo "==> Enabling versioning"
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled

          echo "==> Enabling AES256 encryption"
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'

          echo "==> Blocking all public access"
          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration \
            "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"

          echo "==> Checking DynamoDB table: $TABLE"
          if ! aws dynamodb describe-table --table-name "$TABLE" --region "$REGION" 2>/dev/null; then
            echo "  Creating table..."
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION"
            aws dynamodb wait table-exists --table-name "$TABLE" --region "$REGION"
            echo "  Table created."
          else
            echo "  Table already exists."
          fi

      - name: Terraform Init
        run: terraform -chdir=environments/dev init -reconfigure

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform -chdir=environments/dev plan \
            -out=environments/dev/tfplan.binary \
            2>&1 | tee /tmp/plan_dev.txt
          TF_EXIT=${PIPESTATUS[0]}
          echo "exit_code=${TF_EXIT}" >> $GITHUB_OUTPUT
          exit $TF_EXIT
        continue-on-error: true

      - name: Write Plan to Job Summary
        run: |
          echo "## Terraform Plan: \`dev\`" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/plan_dev.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev-pr${{ github.event.pull_request.number }}
          path: environments/dev/tfplan.binary
          retention-days: 5

      - name: Post Plan Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const exitCode = parseInt('${{ steps.plan.outputs.exit_code }}' || '0');
            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            let planOutput = '';
            try {
              planOutput = fs.readFileSync('/tmp/plan_dev.txt', 'utf8');
            } catch {
              planOutput = 'Could not read plan output.';
            }

            const truncated = planOutput.length > 60000
              ? planOutput.substring(0, 60000) + '\n\n> ⚠️ Output truncated — download the plan artifact for full output.'
              : planOutput;

            const statusIcon = exitCode === 0 ? '✅' : '❌';
            const marker = '<!-- tf-plan-dev -->';

            const body = [
              marker,
              `## ${statusIcon} Terraform Plan: \`dev\``,
              '',
              '<details>',
              '<summary>Show Plan Output</summary>',
              '',
              '```',
              truncated,
              '```',
              '',
              '</details>',
              '',
              `> Commit: \`${sha}\``,
            ].join('\n');

            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of existing.data) {
              if (comment.body && comment.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if Plan Failed
        if: steps.plan.outputs.exit_code != '0'
        run: exit 1
