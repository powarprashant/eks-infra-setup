name: "Terraform Deploy"

on:
  push:
    branches: [main]
    paths:
      - "environments/dev/**"
      - "modules/**"

  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_CLI_ARGS: "-no-color"
  STATE_BUCKET: "cloudcart-terraform-state"
  LOCK_TABLE: "terraform-lock"

jobs:
  deploy-dev:
    name: "Dev — ${{ github.event_name == 'push' && 'apply' || inputs.action }}"
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Bootstrap Terraform Backend
        run: |
          BUCKET="${{ env.STATE_BUCKET }}"
          TABLE="${{ env.LOCK_TABLE }}"
          REGION="${{ secrets.AWS_REGION }}"

          echo "==> Checking S3 bucket: $BUCKET"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "  Creating bucket..."
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --create-bucket-configuration LocationConstraint="$REGION"
          fi
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration \
            "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"

          echo "==> Checking DynamoDB table: $TABLE"
          if ! aws dynamodb describe-table --table-name "$TABLE" --region "$REGION" 2>/dev/null; then
            echo "  Creating table..."
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION"
            aws dynamodb wait table-exists --table-name "$TABLE" --region "$REGION"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Resolve Action
        id: resolve
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "action=apply" >> $GITHUB_OUTPUT
          else
            echo "action=${{ inputs.action }}" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Plan
        run: |
          DESTROY_FLAG=""
          [ "${{ steps.resolve.outputs.action }}" == "destroy" ] && DESTROY_FLAG="-destroy"
          set -o pipefail
          terraform plan $DESTROY_FLAG -out=tfplan.binary 2>&1 | tee /tmp/plan.txt
          echo "## Terraform Plan: dev" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev-${{ github.run_id }}
          path: environments/dev/tfplan.binary
          retention-days: 30

      - name: Terraform Apply / Destroy
        if: steps.resolve.outputs.action != 'plan'
        run: terraform apply -auto-approve tfplan.binary

      - name: Update kubeconfig
        if: steps.resolve.outputs.action == 'apply'
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "$CLUSTER_NAME"

      - name: Verify Cluster Nodes
        if: steps.resolve.outputs.action == 'apply'
        run: |
          echo "Waiting for all nodes to be Ready (timeout: 10m)..."
          kubectl wait --for=condition=Ready nodes --all --timeout=600s
          kubectl get nodes -o wide
          kubectl get pods -n kube-system
